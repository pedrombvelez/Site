<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff6e8" />
      <stop offset="100%" stop-color="#fce7e0" />
    </linearGradient>
    <radialGradient id="sun1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6e8" />
      <stop offset="60%" stop-color="#e6c48d" />
      <stop offset="100%" stop-color="#c9a36a" />
    </radialGradient>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg1)" />
  <!-- soft horizon -->
  <ellipse cx="800" cy="950" rx="900" ry="140" fill="#f5c5b8" opacity="0.45" />
  <!-- sun -->
  <circle cx="1180" cy="380" r="170" fill="url(#sun1)" />
  <!-- sun rays -->
  <g stroke="#c9a36a" stroke-width="7" stroke-linecap="round" opacity="0.7">
    <line x1="1180" y1="120" x2="1180" y2="180" />
    <line x1="1180" y1="580" x2="1180" y2="640" />
    <line x1="920" y1="380" x2="980" y2="380" />
    <line x1="1380" y1="380" x2="1440" y2="380" />
    <line x1="1010" y1="210" x2="1050" y2="250" />
    <line x1="1350" y1="210" x2="1310" y2="250" />
    <line x1="1010" y1="550" x2="1050" y2="510" />
    <line x1="1350" y1="550" x2="1310" y2="510" />
  </g>
  <!-- decorative star (notícia / sparkle) -->
  <path d="M 480 600 L 492 632 L 524 640 L 492 648 L 480 680 L 468 648 L 436 640 L 468 632 Z" fill="#c9a36a" opacity="0.85" />
  <!-- small accent dots -->
  <circle cx="320" cy="380" r="8" fill="#d49380" opacity="0.6" />
  <circle cx="700" cy="240" r="6" fill="#c9a36a" opacity="0.65" />
</svg>
