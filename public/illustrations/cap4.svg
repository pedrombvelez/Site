<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="b4h" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="55" /></filter>
    <filter id="b4m" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18" /></filter>
    <filter id="b4l" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" /></filter>
    <radialGradient id="night4" cx="50%" cy="40%" r="90%">
      <stop offset="0%" stop-color="#fdf6ee" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#e8dfe8" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#cbc1d6" stop-opacity="0.5" />
    </radialGradient>
  </defs>
  <rect width="1600" height="1100" fill="#fdf6ee" />
  <rect width="1600" height="1100" fill="url(#night4)" />
  <!-- night washes (lavender + soft peach) -->
  <ellipse cx="320" cy="320" rx="400" ry="280" fill="#cbc1d6" opacity="0.5" filter="url(#b4h)" />
  <ellipse cx="1300" cy="380" rx="450" ry="320" fill="#fce7e0" opacity="0.45" filter="url(#b4h)" />
  <!-- crescent moon halo -->
  <circle cx="1230" cy="280" r="240" fill="#fff6e8" opacity="0.5" filter="url(#b4h)" />
  <!-- crescent moon (visible) -->
  <g filter="url(#b4m)">
    <circle cx="1230" cy="280" r="135" fill="#fff6e8" />
    <circle cx="1295" cy="260" r="120" fill="#e8dfe8" opacity="0.92" />
  </g>
  <!-- cradle curve at bottom -->
  <ellipse cx="800" cy="1080" rx="900" ry="200" fill="#f5c5b8" opacity="0.4" filter="url(#b4h)" />
  <!-- visible stars -->
  <g fill="#c9a36a" filter="url(#b4l)">
    <circle cx="240" cy="180" r="5" opacity="0.85" />
    <circle cx="450" cy="100" r="4" opacity="0.75" />
    <circle cx="640" cy="200" r="5" opacity="0.85" />
    <circle cx="900" cy="140" r="4" opacity="0.75" />
    <circle cx="1080" cy="220" r="4" opacity="0.8" />
    <circle cx="1450" cy="140" r="5" opacity="0.7" />
    <circle cx="180" cy="500" r="4" opacity="0.6" />
    <circle cx="380" cy="660" r="4" opacity="0.65" />
    <circle cx="700" cy="500" r="5" opacity="0.6" />
  </g>
  <!-- twinkles around moon -->
  <g fill="#c9a36a" filter="url(#b4l)">
    <circle cx="1100" cy="180" r="6" opacity="0.65" />
    <circle cx="1400" cy="450" r="5" opacity="0.55" />
  </g>
</svg>
