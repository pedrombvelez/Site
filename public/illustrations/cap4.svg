<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="b4h" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="55" /></filter>
    <filter id="b4m" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10" /></filter>
    <radialGradient id="moon4" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#fff6e8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#fff6e8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="night4" cx="50%" cy="40%" r="90%">
      <stop offset="0%" stop-color="#fdf6ee" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#e8dfe8" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#cbc1d6" stop-opacity="0.5" />
    </radialGradient>
  </defs>
  <rect width="1600" height="1100" fill="#fdf6ee" />
  <rect width="1600" height="1100" fill="url(#night4)" />
  <!-- night washes -->
  <ellipse cx="320" cy="320" rx="400" ry="280" fill="#cbc1d6" opacity="0.55" filter="url(#b4h)" />
  <ellipse cx="1300" cy="380" rx="450" ry="320" fill="#fce7e0" opacity="0.45" filter="url(#b4h)" />
  <!-- moon halo -->
  <circle cx="1230" cy="300" r="240" fill="#fff6e8" opacity="0.45" filter="url(#b4h)" />
  <!-- moon disc -->
  <circle cx="1230" cy="300" r="160" fill="url(#moon4)" filter="url(#b4m)" />
  <!-- crescent shadow (subtle warm glow on right side suggesting crescent) -->
  <circle cx="1290" cy="280" r="140" fill="#cbc1d6" opacity="0.35" filter="url(#b4m)" />
  <!-- cradle curve at bottom -->
  <ellipse cx="800" cy="1080" rx="900" ry="200" fill="#f5c5b8" opacity="0.4" filter="url(#b4h)" />
