    <path d="M 640 195 L 646 213 L 663 217 L 646 221 L 640 239 L 634 221 L 617 217 L 634 213 Z" opacity="0.85" />
    <path d="M 900 130 L 905 145 L 919 148 L 905 151 L 900 166 L 895 151 L 881 148 L 895 145 Z" opacity="0.75" />
    <path d="M 1080 215 L 1085 230 L 1099 233 L 1085 236 L 1080 251 L 1075 236 L 1061 233 L 1075 230 Z" opacity="0.8" />
    <circle cx="180" cy="500" r="5" opacity="0.65" />
    <circle cx="380" cy="660" r="5" opacity="0.65" />
    <circle cx="700" cy="500" r="6" opacity="0.6" />
    <circle cx="1450" cy="170" r="5" opacity="0.65" />
