<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="b7" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="85" />
    </filter>
    <radialGradient id="heartglow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fce7e0" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#f5c5b8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#fdf6ee" stop-opacity="0.2" />
    </radialGradient>
  </defs>
  <rect width="1600" height="1100" fill="#fdf6ee" />
  <rect width="1600" height="1100" fill="url(#heartglow)" />
  <!-- big heart center, very faded -->
  <g filter="url(#b7)" opacity="0.45" transform="translate(800 580) scale(7)">
    <path d="M 0 -30 C -10 -52, -50 -52, -50 -16 C -50 12, -22 32, 0 60 C 22 32, 50 12, 50 -16 C 50 -52, 10 -52, 0 -30 Z" fill="#d49380" />
  </g>
  <!-- soft surrounding washes -->
  <ellipse cx="200" cy="400" rx="380" ry="300" fill="#fce7e0" filter="url(#b7)" opacity="0.7" />
  <ellipse cx="1400" cy="500" rx="380" ry="300" fill="#f5c5b8" filter="url(#b7)" opacity="0.55" />
  <ellipse cx="700" cy="950" rx="500" ry="220" fill="#a8b89c" filter="url(#b7)" opacity="0.3" />
  <!-- gold sparkles -->
  <g fill="#c9a36a">
    <circle cx="380" cy="220" r="6" opacity="0.7" />
    <circle cx="1200" cy="180" r="5" opacity="0.65" />
    <circle cx="240" cy="780" r="7" opacity="0.6" />
    <circle cx="1360" cy="820" r="6" opacity="0.65" />
    <circle cx="800" cy="120" r="5" opacity="0.55" />
  </g>
</svg>
