<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6e8" />
      <stop offset="50%" stop-color="#fce7e0" />
      <stop offset="100%" stop-color="#f5c5b8" />
    </linearGradient>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg6)" />
  <!-- corner pastel blooms -->
  <ellipse cx="100" cy="100" rx="320" ry="220" fill="#fff6e8" opacity="0.7" />
  <ellipse cx="1500" cy="1000" rx="320" ry="220" fill="#a8b89c" opacity="0.32" />
  <!-- daisies (clean flat 5-petal flowers) -->
  <!-- daisy 1 (large, upper-left) -->
  <g transform="translate(420 280)">
    <ellipse cx="0" cy="-46" rx="20" ry="42" fill="#fdf6ee" stroke="#d49380" stroke-width="3" />
    <ellipse cx="0" cy="-46" rx="20" ry="42" fill="#fdf6ee" stroke="#d49380" stroke-width="3" transform="rotate(72)" />
    <ellipse cx="0" cy="-46" rx="20" ry="42" fill="#fdf6ee" stroke="#d49380" stroke-width="3" transform="rotate(144)" />
    <ellipse cx="0" cy="-46" rx="20" ry="42" fill="#fdf6ee" stroke="#d49380" stroke-width="3" transform="rotate(216)" />
    <ellipse cx="0" cy="-46" rx="20" ry="42" fill="#fdf6ee" stroke="#d49380" stroke-width="3" transform="rotate(288)" />
    <circle r="18" fill="#c9a36a" />
  </g>
  <!-- daisy 2 (medium, right) -->
  <g transform="translate(1180 380)">
    <ellipse cx="0" cy="-38" rx="16" ry="34" fill="#fdf6ee" stroke="#d49380" stroke-width="3" />
    <ellipse cx="0" cy="-38" rx="16" ry="34" fill="#fdf6ee" stroke="#d49380" stroke-width="3" transform="rotate(72)" />
    <ellipse cx="0" cy="-38" rx="16" ry="34" fill="#fdf6ee" stroke="#d49380" stroke-width="3" transform="rotate(144)" />
    <ellipse cx="0" cy="-38" rx="16" ry="34" fill="#fdf6ee" stroke="#d49380" stroke-width="3" transform="rotate(216)" />
    <ellipse cx="0" cy="-38" rx="16" ry="34" fill="#fdf6ee" stroke="#d49380" stroke-width="3" transform="rotate(288)" />
    <circle r="14" fill="#c9a36a" />
  </g>
  <!-- daisy 3 (medium, lower-left) -->
  <g transform="translate(280 780)">
    <ellipse cx="0" cy="-38" rx="16" ry="34" fill="#fce7e0" stroke="#b4715e" stroke-width="3" />
    <ellipse cx="0" cy="-38" rx="16" ry="34" fill="#fce7e0" stroke="#b4715e" stroke-width="3" transform="rotate(72)" />
    <ellipse cx="0" cy="-38" rx="16" ry="34" fill="#fce7e0" stroke="#b4715e" stroke-width="3" transform="rotate(144)" />
    <ellipse cx="0" cy="-38" rx="16" ry="34" fill="#fce7e0" stroke="#b4715e" stroke-width="3" transform="rotate(216)" />
    <ellipse cx="0" cy="-38" rx="16" ry="34" fill="#fce7e0" stroke="#b4715e" stroke-width="3" transform="rotate(288)" />
    <circle r="14" fill="#c9a36a" />
  </g>
  <!-- daisy 4 (small, lower-right) -->
  <g transform="translate(1300 800)">
    <ellipse cx="0" cy="-32" rx="14" ry="28" fill="#fdf6ee" stroke="#d49380" stroke-width="3" />
    <ellipse cx="0" cy="-32" rx="14" ry="28" fill="#fdf6ee" stroke="#d49380" stroke-width="3" transform="rotate(72)" />
    <ellipse cx="0" cy="-32" rx="14" ry="28" fill="#fdf6ee" stroke="#d49380" stroke-width="3" transform="rotate(144)" />
    <ellipse cx="0" cy="-32" rx="14" ry="28" fill="#fdf6ee" stroke="#d49380" stroke-width="3" transform="rotate(216)" />
    <ellipse cx="0" cy="-32" rx="14" ry="28" fill="#fdf6ee" stroke="#d49380" stroke-width="3" transform="rotate(288)" />
    <circle r="12" fill="#c9a36a" />
  </g>
  <!-- floating loose petals -->
  <g fill="#d49380" opacity="0.75">
    <ellipse cx="800" cy="180" rx="16" ry="8" transform="rotate(35 800 180)" />
    <ellipse cx="700" cy="940" rx="18" ry="9" transform="rotate(-25 700 940)" />
    <ellipse cx="1000" cy="980" rx="16" ry="8" transform="rotate(20 1000 980)" />
  </g>
  <!-- accent leaves -->
  <g fill="#a8b89c" opacity="0.7">
    <ellipse cx="600" cy="500" rx="22" ry="8" transform="rotate(-30 600 500)" />
    <ellipse cx="1050" cy="600" rx="22" ry="8" transform="rotate(30 1050 600)" />
  </g>
</svg>
