<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="b6" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="78" />
    </filter>
    <radialGradient id="day" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#fff3e0" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#fdf6ee" stop-opacity="0.4" />
    </radialGradient>
  </defs>
  <rect width="1600" height="1100" fill="#fdf6ee" />
  <rect width="1600" height="1100" fill="url(#day)" />
  <!-- four soft watercolor blooms in different palette colors -->
  <ellipse cx="350" cy="300" rx="380" ry="280" fill="#fce7e0" filter="url(#b6)" opacity="0.7" />
  <ellipse cx="1280" cy="320" rx="420" ry="300" fill="#f5c5b8" filter="url(#b6)" opacity="0.55" />
  <ellipse cx="280" cy="820" rx="360" ry="280" fill="#a8b89c" filter="url(#b6)" opacity="0.4" />
  <ellipse cx="1300" cy="820" rx="380" ry="300" fill="#fff3e0" filter="url(#b6)" opacity="0.7" />
  <ellipse cx="800" cy="550" rx="280" ry="220" fill="#d49380" filter="url(#b6)" opacity="0.18" />
  <!-- floating petals -->
  <g fill="#d49380" opacity="0.45">
    <circle cx="500" cy="200" r="9" />
    <circle cx="950" cy="280" r="7" />
    <circle cx="1100" cy="640" r="8" />
    <circle cx="640" cy="780" r="9" />
    <circle cx="180" cy="600" r="7" />
    <circle cx="1450" cy="540" r="8" />
  </g>
  <g fill="#c9a36a" opacity="0.35">
    <circle cx="700" cy="150" r="5" />
    <circle cx="1200" cy="450" r="6" />
    <circle cx="900" cy="900" r="5" />
  </g>
</svg>
