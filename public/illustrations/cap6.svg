<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="b6h" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="55" /></filter>
    <filter id="b6m" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8" /></filter>
    <radialGradient id="day6" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#fff6e8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#fdf6ee" stop-opacity="0.45" />
    </radialGradient>
  </defs>
  <rect width="1600" height="1100" fill="#fdf6ee" />
  <rect width="1600" height="1100" fill="url(#day6)" />
  <!-- four soft watercolor blooms in different palette colors -->
  <ellipse cx="350" cy="320" rx="380" ry="280" fill="#fce7e0" opacity="0.7" filter="url(#b6h)" />
  <ellipse cx="1280" cy="320" rx="420" ry="300" fill="#f5c5b8" opacity="0.55" filter="url(#b6h)" />
  <ellipse cx="280" cy="820" rx="360" ry="280" fill="#a8b89c" opacity="0.4" filter="url(#b6h)" />
  <ellipse cx="1320" cy="820" rx="380" ry="300" fill="#fff6e8" opacity="0.65" filter="url(#b6h)" />
  <!-- petals: 5-petal flower sprigs (clearly visible) -->
  <g filter="url(#b6m)">
    <!-- daisy 1 -->
    <g transform="translate(450 260)">
      <ellipse cx="0" cy="-30" rx="14" ry="26" fill="#d49380" opacity="0.7" />
      <ellipse cx="0" cy="-30" rx="14" ry="26" fill="#d49380" opacity="0.7" transform="rotate(72)" />
      <ellipse cx="0" cy="-30" rx="14" ry="26" fill="#d49380" opacity="0.7" transform="rotate(144)" />
      <ellipse cx="0" cy="-30" rx="14" ry="26" fill="#d49380" opacity="0.7" transform="rotate(216)" />
      <ellipse cx="0" cy="-30" rx="14" ry="26" fill="#d49380" opacity="0.7" transform="rotate(288)" />
      <circle r="11" fill="#c9a36a" opacity="0.95" />
    </g>
    <!-- daisy 2 -->
    <g transform="translate(1180 580)">
      <ellipse cx="0" cy="-26" rx="12" ry="22" fill="#f5c5b8" opacity="0.85" />
      <ellipse cx="0" cy="-26" rx="12" ry="22" fill="#f5c5b8" opacity="0.85" transform="rotate(72)" />
      <ellipse cx="0" cy="-26" rx="12" ry="22" fill="#f5c5b8" opacity="0.85" transform="rotate(144)" />
      <ellipse cx="0" cy="-26" rx="12" ry="22" fill="#f5c5b8" opacity="0.85" transform="rotate(216)" />
      <ellipse cx="0" cy="-26" rx="12" ry="22" fill="#f5c5b8" opacity="0.85" transform="rotate(288)" />
      <circle r="9" fill="#c9a36a" opacity="0.95" />
    </g>
    <!-- daisy 3 -->
    <g transform="translate(260 660)">
      <ellipse cx="0" cy="-22" rx="10" ry="18" fill="#fce7e0" opacity="0.95" />
      <ellipse cx="0" cy="-22" rx="10" ry="18" fill="#fce7e0" opacity="0.95" transform="rotate(72)" />
      <ellipse cx="0" cy="-22" rx="10" ry="18" fill="#fce7e0" opacity="0.95" transform="rotate(144)" />
      <ellipse cx="0" cy="-22" rx="10" ry="18" fill="#fce7e0" opacity="0.95" transform="rotate(216)" />
      <ellipse cx="0" cy="-22" rx="10" ry="18" fill="#fce7e0" opacity="0.95" transform="rotate(288)" />
      <circle r="8" fill="#c9a36a" opacity="0.95" />
    </g>
    <!-- daisy 4 -->
    <g transform="translate(1380 280)">
      <ellipse cx="0" cy="-26" rx="12" ry="22" fill="#d49380" opacity="0.65" />
      <ellipse cx="0" cy="-26" rx="12" ry="22" fill="#d49380" opacity="0.65" transform="rotate(72)" />
      <ellipse cx="0" cy="-26" rx="12" ry="22" fill="#d49380" opacity="0.65" transform="rotate(144)" />
      <ellipse cx="0" cy="-26" rx="12" ry="22" fill="#d49380" opacity="0.65" transform="rotate(216)" />
      <ellipse cx="0" cy="-26" rx="12" ry="22" fill="#d49380" opacity="0.65" transform="rotate(288)" />
      <circle r="9" fill="#c9a36a" opacity="0.95" />
    </g>
    <!-- floating loose petals -->
    <ellipse cx="800" cy="160" rx="14" ry="7" fill="#d49380" opacity="0.55" transform="rotate(35 800 160)" />
    <ellipse cx="700" cy="900" rx="16" ry="8" fill="#d49380" opacity="0.55" transform="rotate(-25 700 900)" />
    <ellipse cx="1000" cy="940" rx="14" ry="7" fill="#d49380" opacity="0.5" transform="rotate(20 1000 940)" />
  </g>
</svg>
