<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff6e8" />
      <stop offset="60%" stop-color="#fce7e0" />
      <stop offset="100%" stop-color="#f5c5b8" />
    </linearGradient>
    <radialGradient id="sun3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6e8" />
      <stop offset="55%" stop-color="#e6c48d" />
      <stop offset="100%" stop-color="#c9a36a" />
    </radialGradient>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg3)" />
  <!-- horizon glow -->
  <ellipse cx="800" cy="780" rx="900" ry="180" fill="#fff6e8" opacity="0.7" />
  <!-- big sun (centred, clearly visible) -->
  <circle cx="800" cy="600" r="220" fill="url(#sun3)" />
  <!-- rays -->
  <g stroke="#c9a36a" stroke-width="9" stroke-linecap="round" opacity="0.65">
    <line x1="800" y1="270" x2="800" y2="350" />
    <line x1="430" y1="600" x2="510" y2="600" />
    <line x1="1090" y1="600" x2="1170" y2="600" />
    <line x1="540" y1="370" x2="595" y2="425" />
    <line x1="1060" y1="370" x2="1005" y2="425" />
    <line x1="540" y1="830" x2="595" y2="775" />
    <line x1="1060" y1="830" x2="1005" y2="775" />
  </g>
  <!-- horizon line -->
  <line x1="100" y1="800" x2="1500" y2="800" stroke="#d49380" stroke-width="3" stroke-linecap="round" opacity="0.35" />
  <!-- morning star -->
  <path d="M 280 200 L 288 224 L 312 230 L 288 236 L 280 260 L 272 236 L 248 230 L 272 224 Z" fill="#c9a36a" opacity="0.85" />
  <!-- accent flying birds (V shapes) -->
  <g stroke="#b4715e" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6">
    <path d="M 1200 280 q 20 -18 40 0 q 20 -18 40 0" />
    <path d="M 1320 200 q 14 -12 28 0 q 14 -12 28 0" />
  </g>
</svg>
