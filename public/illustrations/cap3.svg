<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="b3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
    <linearGradient id="sunrise" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3e0" stop-opacity="1" />
      <stop offset="50%" stop-color="#fce7e0" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f5c5b8" stop-opacity="0.3" />
    </linearGradient>
  </defs>
  <rect width="1600" height="1100" fill="#fdf6ee" />
  <rect width="1600" height="1100" fill="url(#sunrise)" />
  <!-- big rising sun -->
  <ellipse cx="800" cy="700" rx="780" ry="380" fill="#fff3e0" filter="url(#b3)" opacity="0.85" />
  <ellipse cx="800" cy="720" rx="380" ry="260" fill="#c9a36a" filter="url(#b3)" opacity="0.45" />
  <!-- soft horizon glow -->
  <ellipse cx="800" cy="720" rx="220" ry="160" fill="#fff3e0" filter="url(#b3)" opacity="0.85" />
  <!-- wing edges -->
  <ellipse cx="180" cy="500" rx="280" ry="220" fill="#fce7e0" filter="url(#b3)" opacity="0.6" />
  <ellipse cx="1450" cy="450" rx="280" ry="220" fill="#f5c5b8" filter="url(#b3)" opacity="0.45" />
  <!-- single morning star -->
  <circle cx="1200" cy="200" r="10" fill="#c9a36a" opacity="0.9" />
  <circle cx="1200" cy="200" r="20" fill="#c9a36a" opacity="0.3" />
</svg>
