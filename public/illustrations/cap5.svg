<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff6e8" />
      <stop offset="100%" stop-color="#fce7e0" />
    </linearGradient>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg5)" />
  <!-- ground / floor -->
  <ellipse cx="800" cy="1050" rx="1100" ry="120" fill="#f5c5b8" opacity="0.5" />
  <!-- side sage washes -->
  <ellipse cx="220" cy="500" rx="280" ry="380" fill="#a8b89c" opacity="0.32" />
  <ellipse cx="1380" cy="500" rx="280" ry="380" fill="#a8b89c" opacity="0.32" />
  <!-- pine tree (clean triangular layers) -->
  <g>
    <polygon points="800,260 700,500 900,500" fill="#6a8076" />
    <polygon points="800,420 670,680 930,680" fill="#7d9183" />
    <polygon points="800,600 640,880 960,880" fill="#6a8076" />
    <rect x="780" y="880" width="40" height="80" fill="#8b6f4e" />
  </g>
  <!-- ornaments on the tree (gold + rose dots, no blur) -->
  <g>
    <circle cx="780" cy="500" r="13" fill="#c9a36a" />
    <circle cx="850" cy="600" r="12" fill="#d49380" />
    <circle cx="730" cy="700" r="13" fill="#c9a36a" />
    <circle cx="900" cy="780" r="12" fill="#d49380" />
    <circle cx="800" cy="430" r="11" fill="#d49380" />
    <circle cx="700" cy="800" r="10" fill="#c9a36a" />
    <circle cx="880" cy="500" r="10" fill="#d49380" />
  </g>
  <!-- big star on top -->
  <path d="M 800 175 L 818 230 L 875 230 L 829 263 L 847 320 L 800 285 L 753 320 L 771 263 L 725 230 L 782 230 Z" fill="#c9a36a" />
  <!-- tiny fairy lights around -->
  <g fill="#c9a36a" opacity="0.75">
    <circle cx="280" cy="380" r="6" />
    <circle cx="1320" cy="380" r="6" />
    <circle cx="200" cy="800" r="6" />
    <circle cx="1400" cy="800" r="6" />
    <circle cx="450" cy="220" r="5" />
    <circle cx="1180" cy="220" r="5" />
  </g>
</svg>
