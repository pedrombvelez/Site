<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="b2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
    <radialGradient id="bellyglow" cx="50%" cy="68%" r="55%">
      <stop offset="0%" stop-color="#f5c5b8" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#fce7e0" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#fdf6ee" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1600" height="1100" fill="#fdf6ee" />
  <rect width="1600" height="1100" fill="url(#bellyglow)" />
  <!-- belly-like soft round shape lower-center -->
  <ellipse cx="800" cy="780" rx="560" ry="380" fill="#f5c5b8" filter="url(#b2)" opacity="0.55" />
  <ellipse cx="800" cy="780" rx="320" ry="240" fill="#fce7e0" filter="url(#b2)" opacity="0.7" />
  <!-- crescent moon upper-right -->
  <g filter="url(#b2)" opacity="0.6">
    <circle cx="1300" cy="220" r="140" fill="#fff3e0" />
    <circle cx="1340" cy="200" r="120" fill="#fce7e0" />
  </g>
  <!-- sage edge upper-left -->
  <ellipse cx="180" cy="220" rx="320" ry="220" fill="#a8b89c" filter="url(#b2)" opacity="0.3" />
  <!-- gold dust scattered -->
  <circle cx="450" cy="380" r="6" fill="#c9a36a" opacity="0.6" />
  <circle cx="1180" cy="540" r="5" fill="#c9a36a" opacity="0.5" />
  <circle cx="240" cy="700" r="7" fill="#c9a36a" opacity="0.5" />
  <circle cx="1420" cy="780" r="6" fill="#c9a36a" opacity="0.55" />
</svg>
